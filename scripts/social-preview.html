<!doctype html>
<!-- GitHub social preview (1280×640). Render: chrome-headless-shell --headless --hide-scrollbars --allow-file-access-from-files --window-size=1280,640 --force-device-scale-factor=2 --virtual-time-budget=4000 --screenshot=docs/social-preview.png file://$PWD/scripts/social-preview.html
     social-clover.png is clover_mark(640, color=(46,158,106)) from make_art.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clover Social Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=block" rel="stylesheet">
<style>
  :root { --bg: #FBF4E8; --ink: #2B2620; --ink-2: #7A7064; --green: #2E9E6A; --petal: #F7C6D2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body { font-family: "Nunito", -apple-system, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
         display: flex; align-items: center; justify-content: center; gap: 56px; }

  .buddy { position: relative; width: 300px; height: 300px; }
  .buddy img { width: 100%; height: 100%; }
  .hi { position: absolute; right: -34px; top: 6px; background: #fff; color: var(--ink); font-size: 26px; font-weight: 800;
        padding: 9px 18px 11px; border-radius: 22px 22px 22px 6px; }

  h1 { font-size: 128px; font-weight: 800; letter-spacing: -0.03em; line-height: .95; }
  p { margin-top: 16px; font-size: 32px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink-2); }
  small { display: inline-block; margin-top: 30px; font-size: 18px; font-weight: 700; color: var(--green);
          background: #fff; padding: 9px 16px; border-radius: 99px; }
</style>
</head>
<body>
  <div class="buddy">
    <img src="social-clover.png" alt="">
    <span class="hi">hi!</span>
  </div>
  <div>
    <h1>Clover</h1>
    <p>Your whole Mac, one sentence away.</p>
    <small>free &amp; open source · for macOS</small>
  </div>
</body>
</html>
