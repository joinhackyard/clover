name: Website
on:
  push:
    branches: [main]
    paths: [docs/**, ui/orbs.js, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Publish joinhackyard.github.io/clover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |   # docs/ plus the app's own orb renderer, so the website's clover moves exactly like the app's
          mkdir _site
          cp -R docs/. _site/
          cp ui/orbs.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
