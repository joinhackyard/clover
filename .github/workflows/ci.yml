name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Brain, engine and pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline regressions (brain, provider engine, page harnesses)
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          status=${PIPESTATUS[0]}
          # failures as annotations, readable from the checks API as well as the page
          python3 .github/annotate.py tests "$RUNNER_TEMP/tests.log"
          exit $status
      - name: Script syntax
        run: bash -n build.sh install.sh
      - name: Sounds and artwork rebuild cleanly
        run: |
          pip install --quiet pillow
          python3 scripts/make_sounds.py
          python3 scripts/make_art.py
  macos:
    name: Build Clover.app (macOS 26)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: bash
        run: |
          set +e
          swiftc --version
          CLOVER_PACKAGE="$RUNNER_TEMP/dist" ./build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          python3 .github/annotate.py swift "$RUNNER_TEMP/build.log"
          exit $status
      - name: Native self-test
        run: '"$RUNNER_TEMP/dist/Clover.app/Contents/MacOS/Clover" --selftest'
      - name: Zip the app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/dist/Clover.app" "$RUNNER_TEMP/Clover-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Clover-macOS
          path: ${{ runner.temp }}/Clover-macOS.zip
          retention-days: 14
